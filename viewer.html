<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>library.json viewer</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; }
  #status { margin-bottom: 12px; }
  h2.section { margin: 24px 0 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { width: 160px; background: #333; padding: 6px; font-size: 12px; }
  .card img { width: 100%; height: 220px; object-fit: cover; background: #000; }
  .card .title { font-weight: bold; margin-top: 4px; }
  .card .meta { color: #aaa; }
  .status-read { color: #6f6; }
  .status-unread { color: #ff6; }
</style>
</head>
<body>
<h2>library.json viewer</h2>
<div id="status">loading data/library.json ...</div>
<div id="sections"></div>

<script>
function renderSection(container, heading, records) {
  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `${heading} (${records.length})`;
  container.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const r of records) {
    const card = document.createElement('div');
    card.className = 'card';
    const coverSrc = r.cover_path ? 'data/covers/' + r.cover_path : '';
    card.innerHTML = `
      ${coverSrc ? `<img src="${coverSrc}" loading="lazy">` : '<div style="height:220px;background:#000"></div>'}
      <div class="title">${r.title || '(no title)'}</div>
      <div class="meta">${r.series || ''} ${r.issue_number ? '#' + r.issue_number : ''}</div>
      <div class="meta">${r.year || ''} ${r.publisher || ''}</div>
      <div class="meta">${r.type}</div>
      <div class="status-${r.status}">${r.status}</div>
    `;
    grid.appendChild(card);
  }
  container.appendChild(grid);
}

fetch('data/library.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(records => {
    document.getElementById('status').textContent = `Loaded ${records.length} records.`;
    const digitalOnly = records.filter(r => r.formats.includes('digital') && !r.formats.includes('physical'));
    const physicalOnly = records.filter(r => r.formats.includes('physical') && !r.formats.includes('digital'));
    const both = records.filter(r => r.formats.includes('digital') && r.formats.includes('physical'));

    const container = document.getElementById('sections');
    renderSection(container, 'Digital Collection', digitalOnly);
    renderSection(container, 'Physical Collection', physicalOnly);
    renderSection(container, 'Digital + Physical', both);
  })
  .catch(err => {
    document.getElementById('status').textContent =
      'Failed to load data/library.json: ' + err.message +
      ' — make sure you are running this via a local server (see README), not opening the file directly.';
  });
</script>
</body>
</html>
