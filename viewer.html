<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>library.json viewer</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; }
  #status { margin-bottom: 12px; }
  #search {
    display: block; width: 100%; max-width: 420px; margin-bottom: 16px;
    padding: 6px 8px; font-size: 13px; background: #333; color: #eee;
    border: 1px solid #555; border-radius: 3px;
  }
  #search:focus { outline: none; border-color: #7af; }
  #sections h1 { margin: 32px 0 4px; border-bottom: 2px solid #666; padding-bottom: 6px; }
  h2.section { margin: 24px 0 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
  h3.dupe-group { margin: 16px 0 4px; color: #f66; font-size: 13px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { width: 200px; background: #333; padding: 6px; font-size: 11px; }
  .card img { width: 100%; height: 220px; object-fit: cover; background: #000; }
  .card .title { font-weight: bold; margin-top: 4px; font-size: 12px; }
  .card .meta { color: #aaa; }
  .card .id { color: #888; font-family: monospace; font-size: 10px; user-select: all; word-break: break-all; }
  .card .code { color: #fc6; font-family: monospace; font-size: 10px; user-select: all; word-break: break-all; }
  .card .sources { color: #7af; font-size: 10px; margin-top: 2px; }
  .card .cover-path { color: #8f8; font-size: 10px; font-family: monospace; user-select: all; word-break: break-all; }
  .card .desc { color: #999; font-size: 10px; margin-top: 2px; max-height: 3.2em; overflow: hidden; }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; margin-right: 2px; }
  .badge-digital { background: #246; }
  .badge-print { background: #642; }
  .status-read { color: #6f6; }
  .status-unread { color: #ff6; }
  .flag { color: #f66; font-weight: bold; }
  #dupes .grid { border: 1px solid #633; padding: 8px; margin-bottom: 8px; background: #2a1f1f; }
  #empty-filter { color: #999; font-style: italic; }
  .card .attach { margin-top: 6px; padding-top: 6px; border-top: 1px solid #444; }
  .card .attach input[type="file"] { width: 100%; font-size: 9px; color: #ccc; margin-bottom: 4px; }
  .card .attach-link { display: flex; gap: 3px; }
  .card .attach-link input[type="text"] {
    flex: 1; min-width: 0; font-size: 9px; padding: 2px 4px;
    background: #222; color: #eee; border: 1px solid #555; border-radius: 2px;
  }
  .card .attach-link button {
    font-size: 9px; padding: 2px 6px; background: #456; color: #eee; border: none; border-radius: 2px; cursor: pointer;
  }
  .card .attach-link button:hover { background: #567; }
  .card .attach-status { font-size: 9px; margin-top: 3px; min-height: 1.2em; }
  .card .attach-status.error { color: #f66; }
  .card .attach-status.ok { color: #6f6; }
</style>
</head>
<body>
<h2>library.json viewer</h2>
<div id="status">loading data/library.json ...</div>
<input id="search" type="text" placeholder="Filter by title, series, publisher, or author...">
<div id="dupes"></div>
<div id="sections"></div>

<script>
let allRecords = [];

function normalizeIssue(issue) {
  if (issue && /^\d+$/.test(issue)) return String(parseInt(issue, 10));
  return issue;
}

function codeText(r) {
  if (r.upc) return `UPC: ${r.upc}`;
  if (r.isbn) return `ISBN: ${r.isbn}`;
  return '(no code)';
}

function cardHtml(r) {
  const coverSrc = r.cover_path ? 'data/covers/' + r.cover_path : '';
  const formatBadges = r.formats.map(f => `<span class="badge badge-${f}">${f}</span>`).join('');
  const sourceEntries = Object.entries(r.metadata_source || {});
  const sourcesText = sourceEntries.length
    ? sourceEntries.map(([field, src]) => `${field}:${src}`).join(', ')
    : '(no enrichment)';
  const missing = [];
  if (!r.year) missing.push('year');
  if (!r.description) missing.push('description');
  if (!r.publisher) missing.push('publisher');
  const missingText = missing.length ? `<div class="flag">missing: ${missing.join(', ')}</div>` : '';

  return `
    ${coverSrc ? `<img src="${coverSrc}" loading="lazy">` : '<div style="height:220px;background:#000;color:#f66;display:flex;align-items:center;justify-content:center;">NO COVER</div>'}
    <div class="title">${r.title || '(no title)'}</div>
    <div class="meta">${r.series || ''} ${r.issue_number ? '#' + r.issue_number : ''}</div>
    <div class="meta">${r.year || '?'} · ${r.publisher || '?'} · ${r.type}</div>
    <div>${formatBadges} <span class="status-${r.status}">${r.status}</span></div>
    <div class="id">${r.id}</div>
    <div class="code">${codeText(r)}</div>
    <div class="cover-path">${r.cover_path || '(none)'}</div>
    <div class="sources">${sourcesText}</div>
    <div class="desc" title="${(r.description || '').replace(/"/g, '&quot;')}">${r.description ? r.description.slice(0, 120) + (r.description.length > 120 ? '…' : '') : '(no description)'}</div>
    ${missingText}
    <div class="attach">
      <input type="file" accept="image/*" class="attach-cover-input" data-id="${r.id}">
      <div class="attach-link">
        <input type="text" placeholder="Comic Geeks issue link" class="attach-link-input" data-id="${r.id}">
        <button class="attach-link-btn" data-id="${r.id}">Attach</button>
      </div>
      <div class="attach-status" data-id="${r.id}"></div>
    </div>
  `;
}

function renderSection(container, heading, records) {
  if (records.length === 0) return;

  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `${heading} (${records.length})`;
  container.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const r of records) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = cardHtml(r);
    grid.appendChild(card);
  }
  container.appendChild(grid);
}

function renderDuplicates(container, records) {
  const groups = new Map();
  for (const r of records) {
    if (!r.series) continue;
    const key = `${r.type}|${r.series.toLowerCase()}|${normalizeIssue(r.issue_number)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const dupeGroups = [...groups.entries()].filter(([, list]) => list.length > 1);

  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `Possible Duplicates — same series + issue (${dupeGroups.length} group${dupeGroups.length === 1 ? '' : 's'})`;
  container.appendChild(h);

  if (dupeGroups.length === 0) {
    const p = document.createElement('div');
    p.textContent = 'None found.';
    container.appendChild(p);
    return;
  }

  for (const [key, list] of dupeGroups) {
    const label = document.createElement('h3');
    label.className = 'dupe-group';
    label.textContent = key.replace(/\|/g, ' — ');
    container.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const r of list) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = cardHtml(r);
      grid.appendChild(card);
    }
    container.appendChild(grid);
  }
}

function renderAll(records) {
  const dupesEl = document.getElementById('dupes');
  const sectionsEl = document.getElementById('sections');
  dupesEl.innerHTML = '';
  sectionsEl.innerHTML = '';

  if (records.length === 0) {
    const p = document.createElement('div');
    p.id = 'empty-filter';
    p.textContent = 'No records match this filter.';
    sectionsEl.appendChild(p);
    return;
  }

  renderDuplicates(dupesEl, records);

  for (const [typeLabel, typeValue] of [['Comics', 'comic'], ['Manga', 'manga']]) {
    const group = records.filter(r => r.type === typeValue);
    if (group.length === 0) continue;

    const h = document.createElement('h1');
    h.textContent = `${typeLabel} (${group.length})`;
    sectionsEl.appendChild(h);

    const digitalOnly = group.filter(r => r.formats.includes('digital') && !r.formats.includes('print'));
    const printOnly = group.filter(r => r.formats.includes('print') && !r.formats.includes('digital'));
    const both = group.filter(r => r.formats.includes('digital') && r.formats.includes('print'));

    renderSection(sectionsEl, 'Digital Collection', digitalOnly);
    renderSection(sectionsEl, 'Print Collection', printOnly);
    renderSection(sectionsEl, 'Digital + Print', both);
  }
}

function applyFilter() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const filtered = query
    ? allRecords.filter(r => [r.title, r.series, r.publisher, r.author]
        .some(field => (field || '').toLowerCase().includes(query)))
    : allRecords;

  document.getElementById('status').textContent = query
    ? `Showing ${filtered.length} of ${allRecords.length} record(s).`
    : `Loaded ${allRecords.length} record(s).`;

  renderAll(filtered);
}

function statusElFor(id) {
  return document.querySelector(`.attach-status[data-id="${CSS.escape(id)}"]`);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function postJson(path, body) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let result = {};
  try {
    result = await resp.json();
  } catch (e) {
    // non-JSON response (e.g. a raw 404) — fall through to the generic message below
  }
  if (!resp.ok) throw new Error(result.error || `HTTP ${resp.status}`);
  return result;
}

async function reloadLibrary() {
  const resp = await fetch('data/library.json');
  allRecords = await resp.json();
  applyFilter();
}

document.addEventListener('change', async (e) => {
  if (!e.target.classList.contains('attach-cover-input')) return;
  const input = e.target;
  const file = input.files[0];
  if (!file) return;
  const id = input.dataset.id;
  const statusEl = statusElFor(id);

  statusEl.className = 'attach-status';
  statusEl.textContent = 'Uploading…';
  try {
    const dataUrl = await fileToDataUrl(file);
    const match = /^data:image\/([a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl);
    if (!match) throw new Error('Could not read this file as an image');
    const [, subtype, base64] = match;
    const ext = '.' + subtype.split('+')[0].replace('jpeg', 'jpg');
    await postJson('/api/attach-cover', { id, ext, data_base64: base64 });
    await reloadLibrary();
  } catch (err) {
    statusEl.className = 'attach-status error';
    statusEl.textContent = 'Error: ' + err.message;
  }
});

document.addEventListener('click', async (e) => {
  if (!e.target.classList.contains('attach-link-btn')) return;
  const id = e.target.dataset.id;
  const input = document.querySelector(`.attach-link-input[data-id="${CSS.escape(id)}"]`);
  const statusEl = statusElFor(id);
  const url = input.value.trim();
  if (!url) return;

  statusEl.className = 'attach-status';
  statusEl.textContent = 'Looking up…';
  try {
    await postJson('/api/attach-link', { id, url });
    await reloadLibrary();
  } catch (err) {
    statusEl.className = 'attach-status error';
    statusEl.textContent = 'Error: ' + err.message;
  }
});

fetch('data/library.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(records => {
    allRecords = records;
    document.getElementById('search').addEventListener('input', applyFilter);
    applyFilter();
  })
  .catch(err => {
    document.getElementById('status').textContent =
      'Failed to load data/library.json: ' + err.message +
      ' — make sure you are running this via a local server (see README), not opening the file directly.';
  });
</script>
</body>
</html>
