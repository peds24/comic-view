<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>library.json viewer</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; }
  #status { margin-bottom: 12px; }
  #search {
    display: block; width: 100%; max-width: 420px; margin-bottom: 16px;
    padding: 6px 8px; font-size: 13px; background: #333; color: #eee;
    border: 1px solid #555; border-radius: 3px;
  }
  #search:focus { outline: none; border-color: #7af; }
  #sections h1 { margin: 32px 0 4px; border-bottom: 2px solid #666; padding-bottom: 6px; }
  h2.section { margin: 24px 0 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
  h3.dupe-group { margin: 16px 0 4px; color: #f66; font-size: 13px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { width: 200px; background: #333; padding: 6px; font-size: 11px; }
  .card img { width: 100%; height: 220px; object-fit: cover; background: #000; }
  .card .title { font-weight: bold; margin-top: 4px; font-size: 12px; }
  .card .meta { color: #aaa; }
  .card .year-input {
    width: 42px; font-size: 10px; font-weight: bold; color: #7af;
    background: transparent; border: 1px solid transparent; border-radius: 2px;
    padding: 0 2px; font-family: inherit;
  }
  .card .year-input:hover { border-color: #555; }
  .card .year-input:focus { outline: none; border-color: #7af; background: #222; }
  .card .year-input.saving { color: #fc6; }
  .card .formats-row { margin-top: 3px; }
  .card .format-label { margin-right: 8px; cursor: pointer; user-select: none; }
  .card .format-label input { margin-right: 2px; vertical-align: middle; }
  .card .id { color: #888; font-family: monospace; font-size: 10px; user-select: all; word-break: break-all; }
  .card .code { color: #fc6; font-family: monospace; font-size: 10px; user-select: all; word-break: break-all; }
  .card .sources { color: #7af; font-size: 10px; margin-top: 2px; }
  .card .cover-path { color: #8f8; font-size: 10px; font-family: monospace; user-select: all; word-break: break-all; }
  .card .desc { color: #999; font-size: 10px; margin-top: 2px; max-height: 3.2em; overflow: hidden; }
  .status-read { color: #6f6; }
  .status-unread { color: #ff6; }
  .card .status-dot {
    cursor: pointer; font-size: 13px; margin-left: 6px; user-select: none;
    transition: opacity 0.15s;
  }
  .card .status-dot:hover { opacity: 0.7; }
  .flag { color: #f66; font-weight: bold; }
  #dupes .grid { border: 1px solid #633; padding: 8px; margin-bottom: 8px; background: #2a1f1f; }
  #missing .grid { border: 1px solid #654; padding: 8px; margin-bottom: 8px; background: #2a2519; }
  #empty-filter { color: #999; font-style: italic; }
  #tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  #tabs .tab-btn {
    padding: 6px 18px; font-size: 13px; font-weight: bold; background: #2a2a2a; color: #999;
    border: 1px solid #444; border-radius: 4px; cursor: pointer;
  }
  #tabs .tab-btn:hover { background: #333; color: #ccc; }
  #tabs .tab-btn.active { background: #345; color: #7af; border-color: #7af; }
  #format-filters { margin-bottom: 12px; font-size: 13px; color: #aaa; }
  #format-filters label { margin-right: 14px; cursor: pointer; user-select: none; }
  #format-filters input { margin-right: 4px; vertical-align: middle; }
  .card .title-input {
    font-weight: bold; font-size: 12px; width: 100%; margin-top: 4px;
    background: transparent; color: #eee; border: 1px solid transparent; border-radius: 2px;
    padding: 1px 2px; font-family: inherit;
  }
  .card .title-input:hover { border-color: #555; }
  .card .title-input:focus { outline: none; border-color: #7af; background: #222; }
  .card .title-input.saving { color: #fc6; }
  .card .delete-row { margin-top: 6px; }
  .card .delete-btn {
    width: 100%; font-size: 10px; padding: 3px 6px; background: #522; color: #fbb;
    border: 1px solid #733; border-radius: 2px; cursor: pointer;
  }
  .card .delete-btn:hover { background: #733; color: #fff; }
  .card .attach { margin-top: 6px; padding-top: 6px; border-top: 1px solid #444; }
  .card .attach input[type="file"] { width: 100%; font-size: 9px; color: #ccc; margin-bottom: 4px; }
  .card .attach-link { display: flex; gap: 3px; }
  .card .attach-link input[type="text"] {
    flex: 1; min-width: 0; font-size: 9px; padding: 2px 4px;
    background: #222; color: #eee; border: 1px solid #555; border-radius: 2px;
  }
  .card .attach-link button {
    font-size: 9px; padding: 2px 6px; background: #456; color: #eee; border: none; border-radius: 2px; cursor: pointer;
  }
  .card .attach-link button:hover { background: #567; }
  .card .attach-status { font-size: 9px; margin-top: 3px; min-height: 1.2em; }
  .card .attach-status.error { color: #f66; }
  .card .attach-status.ok { color: #6f6; }
</style>
</head>
<body>
<h2>library.json viewer</h2>
<div id="status">loading data/library.json ...</div>
<div id="tabs">
  <button class="tab-btn" data-type="comic">Comics</button>
  <button class="tab-btn" data-type="manga">Manga</button>
</div>
<input id="search" type="text" placeholder="Filter by title, series, publisher, or author...">
<div id="format-filters">
  <label><input type="checkbox" id="filter-digital"> Digital</label>
  <label><input type="checkbox" id="filter-print"> Print</label>
  <span id="format-filter-hint"></span>
</div>
<div id="missing"></div>
<div id="dupes"></div>
<div id="sections"></div>

<script>
let allRecords = [];
let activeType = 'comic';

function normalizeIssue(issue) {
  if (issue && /^\d+$/.test(issue)) return String(parseInt(issue, 10));
  return issue;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function codeText(r) {
  if (r.upc) return `UPC: ${r.upc}`;
  if (r.isbn) return `ISBN: ${r.isbn}`;
  return '(no code)';
}

function isMissingInfo(r) {
  return !r.cover_path || !r.year || !r.description || !r.publisher;
}

function formatCheckboxes(r) {
  return ['digital', 'print'].map(f => `
    <label class="format-label">
      <input type="checkbox" class="format-checkbox" data-id="${r.id}" data-format="${f}" ${r.formats.includes(f) ? 'checked' : ''}>${f}
    </label>
  `).join('');
}

function cardHtml(r) {
  const coverSrc = r.cover_path ? 'data/covers/' + r.cover_path : '';
  const sourceEntries = Object.entries(r.metadata_source || {});
  const sourcesText = sourceEntries.length
    ? sourceEntries.map(([field, src]) => `${field}:${src}`).join(', ')
    : '(no enrichment)';
  const missing = [];
  if (!r.year) missing.push('year');
  if (!r.description) missing.push('description');
  if (!r.publisher) missing.push('publisher');
  const missingText = missing.length ? `<div class="flag">missing: ${missing.join(', ')}</div>` : '';

  return `
    ${coverSrc ? `<img src="${coverSrc}" loading="lazy">` : '<div style="height:220px;background:#000;color:#f66;display:flex;align-items:center;justify-content:center;">NO COVER</div>'}
    <input class="title-input" data-id="${r.id}" value="${escapeAttr(r.title || '')}" placeholder="(no title)">
    <div class="meta">${r.series || ''} ${r.issue_number ? '#' + r.issue_number : ''}
      (<input class="year-input" data-id="${r.id}" value="${r.year || ''}" placeholder="year?" size="4">)
    </div>
    <div class="meta">${r.publisher || '?'} · ${r.type}${r.author ? ' · ' + r.author : ''}</div>
    <div class="formats-row">${formatCheckboxes(r)}
      <span class="status-dot status-${r.status}" data-id="${r.id}" title="Click to mark ${r.status === 'read' ? 'unread' : 'read'}">● ${r.status}</span>
    </div>
    <div class="id">${r.id}</div>
    <div class="code">${codeText(r)}</div>
    <div class="cover-path">${r.cover_path || '(none)'}</div>
    <div class="sources">${sourcesText}</div>
    <div class="desc" title="${(r.description || '').replace(/"/g, '&quot;')}">${r.description ? r.description.slice(0, 120) + (r.description.length > 120 ? '…' : '') : '(no description)'}</div>
    ${missingText}
    <div class="delete-row">
      <button class="delete-btn" data-id="${r.id}" data-title="${escapeAttr(r.title || '(no title)')}">Delete permanently</button>
    </div>
    <div class="attach">
      <input type="file" accept="image/*" class="attach-cover-input" data-id="${r.id}">
      <div class="attach-link">
        <input type="text" placeholder="Comic Geeks issue link" class="attach-link-input" data-id="${r.id}">
        <button class="attach-link-btn" data-id="${r.id}">Attach</button>
      </div>
      <div class="attach-status" data-id="${r.id}"></div>
    </div>
  `;
}

function renderSection(container, heading, records) {
  if (records.length === 0) return;

  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `${heading} (${records.length})`;
  container.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const r of records) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = cardHtml(r);
    grid.appendChild(card);
  }
  container.appendChild(grid);
}

function renderMissing(container, records) {
  const missing = records.filter(isMissingInfo).sort((a, b) => {
    const sa = (a.series || a.title || '').toLowerCase();
    const sb = (b.series || b.title || '').toLowerCase();
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  });

  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `Missing Info — needs a cover, year, description, or publisher (${missing.length})`;
  container.appendChild(h);

  if (missing.length === 0) {
    const p = document.createElement('div');
    p.textContent = 'None found.';
    container.appendChild(p);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const r of missing) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = cardHtml(r);
    grid.appendChild(card);
  }
  container.appendChild(grid);
}

function renderDuplicates(container, records) {
  // Group by series+issue first, then split each group by year — different
  // runs of the same title reuse issue numbers (Batman #1 (2016) vs Batman
  // #1 (2025) are not duplicates of each other, just different volumes).
  // Records with no parsed year fall into their own "year unknown" bucket
  // rather than being compared against a known year, since we can't tell
  // which run they actually belong to.
  const baseGroups = new Map();
  for (const r of records) {
    if (!r.series) continue;
    const key = `${r.type}|${r.series.toLowerCase()}|${normalizeIssue(r.issue_number)}`;
    if (!baseGroups.has(key)) baseGroups.set(key, []);
    baseGroups.get(key).push(r);
  }

  const dupeGroups = [];
  for (const [key, list] of baseGroups) {
    const byYear = new Map();
    for (const r of list) {
      const yearKey = r.year || 'year unknown';
      if (!byYear.has(yearKey)) byYear.set(yearKey, []);
      byYear.get(yearKey).push(r);
    }
    for (const [yearKey, yearList] of byYear) {
      if (yearList.length > 1) {
        dupeGroups.push([`${key}|${yearKey}`, yearList]);
      }
    }
  }

  const h = document.createElement('h2');
  h.className = 'section';
  h.textContent = `Possible Duplicates — same series + issue + year (${dupeGroups.length} group${dupeGroups.length === 1 ? '' : 's'})`;
  container.appendChild(h);

  if (dupeGroups.length === 0) {
    const p = document.createElement('div');
    p.textContent = 'None found.';
    container.appendChild(p);
    return;
  }

  for (const [key, list] of dupeGroups) {
    const label = document.createElement('h3');
    label.className = 'dupe-group';
    label.textContent = key.replace(/\|/g, ' — ');
    container.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const r of list) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = cardHtml(r);
      grid.appendChild(card);
    }
    container.appendChild(grid);
  }
}

function renderAll(records) {
  const missingEl = document.getElementById('missing');
  const dupesEl = document.getElementById('dupes');
  const sectionsEl = document.getElementById('sections');
  missingEl.innerHTML = '';
  dupesEl.innerHTML = '';
  sectionsEl.innerHTML = '';

  if (records.length === 0) {
    const p = document.createElement('div');
    p.id = 'empty-filter';
    p.textContent = 'No records match this filter.';
    sectionsEl.appendChild(p);
    return;
  }

  renderMissing(missingEl, records);
  renderDuplicates(dupesEl, records);

  const sorted = [...records].sort((a, b) => {
    const sa = (a.series || a.title || '').toLowerCase();
    const sb = (b.series || b.title || '').toLowerCase();
    if (sa !== sb) return sa < sb ? -1 : 1;

    const ia = normalizeIssue(a.issue_number);
    const ib = normalizeIssue(b.issue_number);
    const na = ia != null && /^\d+$/.test(ia) ? parseInt(ia, 10) : null;
    const nb = ib != null && /^\d+$/.test(ib) ? parseInt(ib, 10) : null;
    if (na != null && nb != null) return na - nb;

    const ta = (a.title || '').toLowerCase();
    const tb = (b.title || '').toLowerCase();
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });

  renderSection(sectionsEl, 'Library', sorted);
}

function matchesFormatFilter(r) {
  const digitalOn = document.getElementById('filter-digital').checked;
  const printOn = document.getElementById('filter-print').checked;
  if (!digitalOn && !printOn) return true; // no filter applied
  if (digitalOn && printOn) return r.formats.includes('digital') && r.formats.includes('print');
  if (digitalOn) return r.formats.includes('digital');
  return r.formats.includes('print');
}

function updateFormatFilterHint() {
  const digitalOn = document.getElementById('filter-digital').checked;
  const printOn = document.getElementById('filter-print').checked;
  const hint = document.getElementById('format-filter-hint');
  hint.textContent = (digitalOn && printOn) ? '(showing only items owned both digitally and physically)' : '';
}

function applyFilter() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const inTab = allRecords.filter(r => r.type === activeType);
  const searched = query
    ? inTab.filter(r => [r.title, r.series, r.publisher, r.author]
        .some(field => (field || '').toLowerCase().includes(query)))
    : inTab;
  const filtered = searched.filter(matchesFormatFilter);

  updateFormatFilterHint();
  document.getElementById('status').textContent = (query || filtered.length !== inTab.length)
    ? `Showing ${filtered.length} of ${inTab.length} record(s).`
    : `Loaded ${inTab.length} record(s).`;

  renderAll(filtered);
}

function setActiveTab(type) {
  activeType = type;
  for (const btn of document.querySelectorAll('#tabs .tab-btn')) {
    btn.classList.toggle('active', btn.dataset.type === type);
  }
  applyFilter();
}

function statusElFor(id) {
  return document.querySelector(`.attach-status[data-id="${CSS.escape(id)}"]`);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function postJson(path, body) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let result = {};
  try {
    result = await resp.json();
  } catch (e) {
    // non-JSON response (e.g. a raw 404) — fall through to the generic message below
  }
  if (!resp.ok) throw new Error(result.error || `HTTP ${resp.status}`);
  return result;
}

async function reloadLibrary() {
  const resp = await fetch('data/library.json');
  allRecords = await resp.json();
  applyFilter();
}

document.addEventListener('change', async (e) => {
  if (e.target.classList.contains('title-input')) {
    const input = e.target;
    const id = input.dataset.id;
    const record = allRecords.find(r => r.id === id);
    const title = input.value.trim();
    if (!title) {
      input.value = record ? record.title : '';
      return;
    }
    if (record && title === record.title) return;

    input.classList.add('saving');
    try {
      await postJson('/api/update-title', { id, title });
      if (record) record.title = title;
    } catch (err) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Error saving title: ' + err.message;
      }
      input.value = record ? record.title : '';
    } finally {
      input.classList.remove('saving');
    }
    return;
  }

  if (e.target.classList.contains('year-input')) {
    const input = e.target;
    const id = input.dataset.id;
    const record = allRecords.find(r => r.id === id);
    const raw = input.value.trim();
    if (raw === (record ? String(record.year || '') : '')) return;

    if (raw && !/^\d{1,4}$/.test(raw)) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Year must be a whole number';
      }
      input.value = record ? (record.year || '') : '';
      return;
    }

    input.classList.add('saving');
    try {
      await postJson('/api/update-year', { id, year: raw || null });
      if (record) record.year = raw ? parseInt(raw, 10) : null;
      await reloadLibrary(); // year affects duplicate grouping — refresh it
    } catch (err) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Error saving year: ' + err.message;
      }
      input.value = record ? (record.year || '') : '';
    } finally {
      input.classList.remove('saving');
    }
    return;
  }

  if (e.target.classList.contains('format-checkbox')) {
    const checkbox = e.target;
    const id = checkbox.dataset.id;
    const record = allRecords.find(r => r.id === id);
    const checked = [...document.querySelectorAll(`.format-checkbox[data-id="${CSS.escape(id)}"]`)]
      .filter(cb => cb.checked)
      .map(cb => cb.dataset.format);

    if (checked.length === 0) {
      checkbox.checked = true; // must keep at least one format
      return;
    }

    try {
      await postJson('/api/update-formats', { id, formats: checked });
      if (record) record.formats = checked;
      await reloadLibrary(); // formats affect which section a card is grouped into
    } catch (err) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Error saving formats: ' + err.message;
      }
      checkbox.checked = !checkbox.checked;
    }
    return;
  }

  if (!e.target.classList.contains('attach-cover-input')) return;
  const input = e.target;
  const file = input.files[0];
  if (!file) return;
  const id = input.dataset.id;
  const statusEl = statusElFor(id);

  statusEl.className = 'attach-status';
  statusEl.textContent = 'Uploading…';
  try {
    const dataUrl = await fileToDataUrl(file);
    const match = /^data:image\/([a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl);
    if (!match) throw new Error('Could not read this file as an image');
    const [, subtype, base64] = match;
    const ext = '.' + subtype.split('+')[0].replace('jpeg', 'jpg');
    await postJson('/api/attach-cover', { id, ext, data_base64: base64 });
    await reloadLibrary();
    const newStatusEl = statusElFor(id);
    if (newStatusEl) {
      newStatusEl.className = 'attach-status ok';
      newStatusEl.textContent = 'Cover attached ✓';
    }
  } catch (err) {
    statusEl.className = 'attach-status error';
    statusEl.textContent = 'Error: ' + err.message;
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.target.classList.contains('title-input') || e.target.classList.contains('year-input')) && e.key === 'Enter') {
    e.target.blur();
  }
});

document.addEventListener('click', async (e) => {
  if (e.target.classList.contains('delete-btn')) {
    const btn = e.target;
    const id = btn.dataset.id;
    const title = btn.dataset.title;
    const ok = confirm(
      `Permanently delete "${title}"?\n\n` +
      `This removes it from the library and deletes its cached cover. ` +
      `The original .cbr/.cbz file on disk is NOT touched.`
    );
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
      await postJson('/api/delete-record', { id });
      allRecords = allRecords.filter(r => r.id !== id);
      applyFilter();
    } catch (err) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Error deleting: ' + err.message;
      }
      btn.disabled = false;
      btn.textContent = 'Delete permanently';
    }
    return;
  }

  if (e.target.classList.contains('status-dot')) {
    const dot = e.target;
    const id = dot.dataset.id;
    const record = allRecords.find(r => r.id === id);
    if (!record) return;
    const newStatus = record.status === 'read' ? 'unread' : 'read';

    dot.style.pointerEvents = 'none';
    try {
      await postJson('/api/update-status', { id, status: newStatus });
      record.status = newStatus;
      dot.classList.remove('status-read', 'status-unread');
      dot.classList.add(`status-${newStatus}`);
      dot.textContent = `● ${newStatus}`;
      dot.title = `Click to mark ${newStatus === 'read' ? 'unread' : 'read'}`;
    } catch (err) {
      const statusEl = statusElFor(id);
      if (statusEl) {
        statusEl.className = 'attach-status error';
        statusEl.textContent = 'Error updating status: ' + err.message;
      }
    } finally {
      dot.style.pointerEvents = '';
    }
    return;
  }

  if (!e.target.classList.contains('attach-link-btn')) return;
  const id = e.target.dataset.id;
  const input = document.querySelector(`.attach-link-input[data-id="${CSS.escape(id)}"]`);
  const statusEl = statusElFor(id);
  const url = input.value.trim();
  if (!url) return;

  statusEl.className = 'attach-status';
  statusEl.textContent = 'Looking up…';
  try {
    await postJson('/api/attach-link', { id, url });
    await reloadLibrary();
    const newStatusEl = statusElFor(id);
    if (newStatusEl) {
      newStatusEl.className = 'attach-status ok';
      newStatusEl.textContent = 'Attached ✓';
    }
  } catch (err) {
    statusEl.className = 'attach-status error';
    statusEl.textContent = 'Error: ' + err.message;
  }
});

fetch('data/library.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(records => {
    allRecords = records;
    document.getElementById('search').addEventListener('input', applyFilter);
    document.getElementById('filter-digital').addEventListener('change', applyFilter);
    document.getElementById('filter-print').addEventListener('change', applyFilter);
    for (const btn of document.querySelectorAll('#tabs .tab-btn')) {
      btn.addEventListener('click', () => setActiveTab(btn.dataset.type));
    }
    setActiveTab(activeType);
  })
  .catch(err => {
    document.getElementById('status').textContent =
      'Failed to load data/library.json: ' + err.message +
      ' — make sure you are running this via a local server (see README), not opening the file directly.';
  });
</script>
</body>
</html>
